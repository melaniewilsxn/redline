[project]
name = "redline"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi~=0.162.2",
    "uvicorn[standard]~=0.54.0",
    "psycopg[binary]~=3.3.8",
    "psycopg-pool~=3.3.3",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.2.0",
    "ruff~=0.17.4",
]

[build-system]
requires = ["uv_build~=0.13.7"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
