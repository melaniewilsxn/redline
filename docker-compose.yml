services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_DB: redline
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - redline_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U redline -d redline"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  redline_postgres_data:
